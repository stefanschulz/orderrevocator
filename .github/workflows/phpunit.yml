name: PHP Tests
on: [push, pull_request]
jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,intl,zip
      - run: |
          cd orderrevocator
          composer install --prefer-dist --no-progress
          ./vendor/bin/phpunit
